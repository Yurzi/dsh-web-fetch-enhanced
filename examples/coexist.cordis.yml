# Profile patch: keep the native provider and register this plugin beside it.
# Only needed when something else must keep using the native `http` provider.
- id: web-fetch-http
  disabled: false

- id: web-fetch-enhanced
  config:
    providerId: http-enhanced
    allowCidrs:
      - 198.18.0.0/15

# Route web_fetch to the plugin. A patch replaces the row's whole config:
# restate searchProvider too, or web_search loses its pinned provider.
- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: http-enhanced
