name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No registry-url: npm trusted publishing authenticates this workflow
      # through OIDC, and a configured token would take its place.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      # prepack runs the full check (typecheck, lint, build, test, publint).
      - run: pnpm publish --access public --no-git-checks --provenance
