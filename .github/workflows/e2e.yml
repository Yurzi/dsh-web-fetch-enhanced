name: e2e

# Slow and networked: run by hand before a release or after a DSH upgrade.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      # The DSH CLI under test, installed once per version.
      - uses: actions/cache@v6
        with:
          path: .e2e/dsh-*
          key: e2e-dsh-${{ hashFiles('package.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e
        env:
          DSH_E2E_CHROMIUM: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-artifacts
          path: |
            .e2e/artifacts
            .e2e/run/web.log
